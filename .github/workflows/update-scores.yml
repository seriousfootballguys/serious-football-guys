name: Update Fantasy Scores

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-scores:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update scores
        run: node scripts/update-scores.mjs

      - name: Commit updated scores
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scores.json player-ids.json
          git diff --cached --quiet || git commit -m "Update fantasy scores"
          git push
